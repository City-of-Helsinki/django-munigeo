name: Create release & publish to PyPI
run-name: >-
  ${{
    inputs.ref &&
      (inputs.skip-build
        && format('Release-please only ({0})', inputs.ref)
        || format('Publish {0}', inputs.ref))
    || null
  }}

on:
  push:
    branches:
      - main
  # Run daily to keep the release PR date current.
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag or SHA to publish. E.g. main, refs/tags/v1.0.0, aeb2839."
        required: true
        type: string
      skip-build:
        description: "Skip artifact build and publish, i.e. run release-please only."
        default: false
        type: boolean

jobs:
  release-please:
    uses: City-of-Helsinki/.github/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      include-component-in-tag: false

  build:
    needs:
      - release-please
    uses: City-of-Helsinki/.github/.github/workflows/build-python-dists.yml@main
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}
    # Reusable workflow outputs are strings, including boolean action outputs.
    if: ${{ !inputs.skip-build && (needs.release-please.outputs.release_created == 'true' || inputs.ref) }}

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    # Run publish job if an artifact was uploaded
    if: ${{ needs.build.outputs.artifact_name }}
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
