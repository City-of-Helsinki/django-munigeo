name: CI

on:
  push:
    branches:
      - main
      - RATY-306/1.0  # TODO: remove after RATY-306/1.0 is merged to main
  pull_request:
    branches:
      - main
      - RATY-306/1.0  # TODO: remove after RATY-306/1.0 is merged to main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    uses: City-of-Helsinki/.github/.github/workflows/ci-python-library.yml@main
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      python-version: "3.10"
      python-matrix: "['3.10', '3.11', '3.12', '3.13']"
      postgres-major-version: "17"
      use-postgis: true
